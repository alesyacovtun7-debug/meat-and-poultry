<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#182f25">
  <meta name="description" content="Practise English through five shopping trips in a British supermarket.">
  <title>Meat and Poultry — GURU Supermarket</title>
  <link rel="icon" href="assets/guru-icon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <button class="brand" type="button" data-action="home" aria-label="GURU Supermarket home">
        <span class="brand-mark">GURU<span>.</span></span>
        <span class="brand-name">Supermarket<span>Meat and Poultry</span></span>
      </button>
      <nav class="header-actions" aria-label="Game navigation">
        <button class="nav-button" type="button" data-action="levels">Levels</button>
        <button class="nav-button sound-toggle" type="button" data-action="sound" aria-pressed="true"><i class="sound-icon" aria-hidden="true"></i><span>Sound On</span></button>
        <button class="button button-outline teacher-link" type="button" data-action="teacher">Teacher Mode</button>
      </nav>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="site-footer">
    <div><b>GURU</b><span>English practice · A1–A2</span></div>
    <button type="button" class="text-button" data-action="reset">Reset Progress</button>
  </footer>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <noscript><p class="noscript">Please turn on JavaScript to play GURU Supermarket.</p></noscript>
</body>
</html>
